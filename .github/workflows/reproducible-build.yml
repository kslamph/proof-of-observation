name: reproducible-build

on:
  workflow_dispatch:
    inputs:
      nitro_cli_version:
        description: 'aws-nitro-enclaves-cli tag'
        required: true
        default: 'v1.4.5'
      ref:
        description: 'proof-of-observation git ref to build'
        required: true
        default: '03fe2a3eb6d05e1ec94f7f52ac0521d42560a731'
      docker_version:
        description: 'Docker version to pin (apt version string substring)'
        required: true
        default: '29.1.3'
  push:
    branches: [main]
    paths:
      - 'enclave/**'
      - '.github/workflows/reproducible-build.yml'

# 在 arm64 上双构 enclave,验证 PCR0 可复现性。第三方复算的权威路径:
# 你的 PCR0 == docs/tee-reproducible-build.md 的规范值 == 运行中 attestation。
jobs:
  pcr0:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Environment
        run: |
          uname -a
          docker --version
          df -h / | tail -1

      - name: Pin Docker to documented version
        run: |
          DVER='${{ inputs.docker_version }}'; [ -n "$DVER" ] || DVER='29.1.3'
          VER="${DVER}-1~ubuntu.24.04~noble"
          cd "$RUNNER_TEMP"
          base="https://download.docker.com/linux/ubuntu/dists/noble/pool/stable/arm64"
          curl -fsSLO "$base/docker-ce_${VER}_arm64.deb"
          curl -fsSLO "$base/docker-ce-cli_${VER}_arm64.deb"
          sudo dpkg -i "docker-ce_${VER}_arm64.deb" "docker-ce-cli_${VER}_arm64.deb"
          sudo systemctl restart docker || sudo service docker restart || true
          docker --version
          docker info --format '{{.ServerVersion}}'

      - name: Build nitro-cli (source, tools container)
        run: |
          git clone --depth 1 --branch ${{ inputs.nitro_cli_version || 'v1.4.5' }} \
            https://github.com/aws/aws-nitro-enclaves-cli.git /tmp/nitro-cli
          cd /tmp/nitro-cli
          make nitro-cli
          find /tmp/nitro-cli/build -name nitro-cli -type f

      - name: Install nitro-cli + blobs
        run: |
          sudo install -m 0755 "$(find /tmp/nitro-cli/build -name nitro-cli -type f | head -1)" /usr/bin/nitro-cli
          sudo mkdir -p /usr/share/nitro_enclaves/blobs
          sudo cp -r /tmp/nitro-cli/blobs/aarch64/* /usr/share/nitro_enclaves/blobs/
          sudo mkdir -p /var/log/nitro_enclaves
          nitro-cli --version || true

      - name: Double reproducible build (enclave/)
        working-directory: enclave
        run: bash reproducible-build.sh "$RUNNER_TEMP/repro"

      - name: Compare against canonical PCR0
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/repro"
          PA=$(grep -oE '[0-9a-f]{96}' "$OUT/v6a.enclave.log" | head -1 || true)
          PB=$(grep -oE '[0-9a-f]{96}' "$OUT/v6b.enclave.log" | head -1 || true)
          CANON=$(grep -oE '[0-9a-f]{96}' docs/tee-reproducible-build.md | head -1 || true)
          echo "PCR0_A     = $PA"
          echo "PCR0_B     = $PB"
          echo "CANONICAL  = $CANON"
          {
            echo "## PCR0 reproducibility"
            echo ""
            echo "- PCR0_A: \`$PA\`"
            echo "- PCR0_B: \`$PB\`"
            echo "- canonical (docs): \`$CANON\`"
            echo ""
            if [ "$PA" = "$PB" ]; then echo "- ✅ two no-cache builds agree"; else echo "- ❌ builds disagree"; fi
            if [ -n "$CANON" ] && [ "$PA" = "$CANON" ]; then
              echo "- ✅ PCR0_A == canonical"
            elif [ -n "$CANON" ]; then
              echo "- ⚠️ PCR0_A != canonical (source/toolchain drift?)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test "$PA" = "$PB"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-build
          path: ${{ runner.temp }}/repro
          retention-days: 7
